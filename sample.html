<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Metro Select demo</title>
    <link rel="stylesheet" href="metro-select.css">
    <style>
        body { background: #111827; color: #f9fafb; font: 20px system-ui; margin: 4rem; }
        .sample-option { color: #60a5fa; }
        .disabled { color: #9ca3af; }
    </style>
</head>
<body>
    <h1>Metro Select 3</h1>
    <select id="select-box" aria-label="Temperature unit">
        <option class="removeable" value="celsius">celsius</option>
        <option class="sample-option" value="fahrenheit">fahrenheit</option>
        <option class="removeable removed" value="kelvin">kelvin</option>
        <option class="removeable" value="centigrade">centigrade</option>
    </select>
    <p id="output" aria-live="polite"></p>
    <button id="set-active" type="button">Select celsius</button>

    <script type="module">
        import MetroSelect from './metro-select.js';

        const output = document.querySelector('#output');
        const metroSelect = new MetroSelect(document.querySelector('#select-box'), {
            initial: 'fahrenheit',
            optionClass: 'sample-option',
            parentRemovedClass: 'disabled',
            onChange: (value) => output.textContent = `Selected: ${value}`,
            onVisibilityChange: (value, visible, confirm) => {
                output.textContent = `${visible ? 'Showing' : 'Hiding'}: ${value}`;
                confirm(true);
            },
        });

        document.querySelector('#set-active').addEventListener('click', () => {
            metroSelect.select('celsius');
        });
    </script>
</body>
</html>
